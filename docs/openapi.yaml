          pattern: '^[a-fA-F0-9]{24}$'
          example: 6adc36a09f3c1a7e524b1d58
        email:
          type: string
          format: email
          example: anna@example.com
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
          example: '2026-10-24T04:40:00.512+00:00'

    Exercise:
      type: object
      required: [id, name, muscle_groups, equipment, created_at]
